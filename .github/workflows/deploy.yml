name: CI / Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1: Checks ────────────────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: |
          echo "Checking syntax of backend .js files..."
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            -not -path "./public/*" \
            | xargs -I{} node --check {}
          echo "✓ Syntax OK"

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high

      - name: Docker build test
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false   # nur bauen, nicht pushen

  # ─── Job 2: Deploy (nur wenn CI grün) ────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci   # blockiert bis ci erfolgreich

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Code per rsync übertragen
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT || '22' }}" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/Presentations/

      - name: Container neu starten
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            cd /opt/Presentations

            echo "→ Build & restart containers..."
            docker compose up -d --build --remove-orphans

            echo "→ Migrate presentation frameworks..."
            docker compose exec -T nexus node scripts/migrate-presentations.js || true

            echo "→ Cleanup unused Docker images..."
            docker image prune -f

            echo "✅ Deployment abgeschlossen"
