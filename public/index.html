<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides.IQ — AI Presentation Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%237c3aed'/><stop offset='100%25' stop-color='%2306b6d4'/></linearGradient></defs><rect width='40' height='40' rx='9' fill='url(%23g)'/><rect x='6' y='10' width='17' height='3' rx='1.5' fill='white' opacity='.95'/><rect x='6' y='16' width='12' height='2' rx='1' fill='white' opacity='.6'/><rect x='6' y='21' width='14' height='2' rx='1' fill='white' opacity='.6'/><circle cx='29' cy='15' r='2.2' fill='white' opacity='.95'/><circle cx='34' cy='11' r='1.4' fill='white' opacity='.7'/><circle cx='34' cy='19' r='1.4' fill='white' opacity='.7'/><circle cx='24' cy='22' r='1.4' fill='white' opacity='.7'/><line x1='29' y1='15' x2='34' y2='11' stroke='white' stroke-width='1' opacity='.5'/><line x1='29' y1='15' x2='34' y2='19' stroke='white' stroke-width='1' opacity='.5'/><line x1='29' y1='15' x2='24' y2='22' stroke='white' stroke-width='1' opacity='.5'/><rect x='14' y='30' width='12' height='3' rx='1.5' fill='url(%23g)' opacity='.5'/><rect x='18' y='27' width='4' height='4' rx='1' fill='url(%23g)' opacity='.6'/></svg>">
</head>
<body>
  <!-- Particle Canvas Background -->
  <canvas id="particles-bg"></canvas>

  <!-- App Shell -->
  <div id="app">
    <!-- Sidebar Navigation -->
    <nav id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="36" height="36">
            <defs>
              <linearGradient id="logo-g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="9" fill="url(#logo-g)"/>
            <rect x="6" y="10" width="17" height="3" rx="1.5" fill="white" opacity=".95"/>
            <rect x="6" y="16" width="12" height="2" rx="1" fill="white" opacity=".6"/>
            <rect x="6" y="21" width="14" height="2" rx="1" fill="white" opacity=".6"/>
            <circle cx="29" cy="15" r="2.2" fill="white" opacity=".95"/>
            <circle cx="34" cy="11" r="1.4" fill="white" opacity=".7"/>
            <circle cx="34" cy="19" r="1.4" fill="white" opacity=".7"/>
            <circle cx="24" cy="22" r="1.4" fill="white" opacity=".7"/>
            <line x1="29" y1="15" x2="34" y2="11" stroke="white" stroke-width="1" opacity=".5"/>
            <line x1="29" y1="15" x2="34" y2="19" stroke="white" stroke-width="1" opacity=".5"/>
            <line x1="29" y1="15" x2="24" y2="22" stroke="white" stroke-width="1" opacity=".5"/>
            <rect x="14" y="30" width="12" height="3" rx="1.5" fill="url(#logo-g)" opacity=".5"/>
            <rect x="18" y="27" width="4" height="4" rx="1" fill="url(#logo-g)" opacity=".6"/>
          </svg>
        </div>
        <span class="logo-text">Slides<span class="logo-iq">.IQ</span></span>
        <button class="sidebar-toggle" id="sidebar-toggle" title="Sidebar einklappen">‹</button>
      </div>

      <div class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Meine Slides</span>
        </a>
        <a href="#templates" class="nav-item" data-view="templates">
          <span class="nav-icon">◻</span>
          <span class="nav-label">Templates</span>
        </a>
<a href="#settings" class="nav-item" data-view="settings">
          <span class="nav-icon">◎</span>
          <span class="nav-label">Einstellungen</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="api-status" id="api-status">
          <div class="status-dot"></div>
          <span>Claude</span>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <div id="view-container">
        <!-- Views are injected here by the router -->
        <div class="loading-screen">
          <div class="loading-orb"></div>
          <p>Slides.IQ lädt...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-container" class="modal-container">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Presenter Mode Window (opened in new window) -->
  <div id="presenter-panel" class="presenter-panel hidden">
    <div class="presenter-header">
      <button class="presenter-close" onclick="closePresenter()">✕ Schließen</button>
      <div class="presenter-timer" id="presenter-timer">00:00</div>
      <button class="presenter-btn" onclick="resetTimer()">↺</button>
    </div>
    <div class="presenter-body">
      <div class="presenter-current">
        <h4>Aktuelle Slide</h4>
        <iframe id="presenter-iframe" src="about:blank"></iframe>
      </div>
      <div class="presenter-sidebar">
        <div class="presenter-notes">
          <h4>Speaker Notes</h4>
          <div id="presenter-notes-content">—</div>
        </div>
        <div class="presenter-next">
          <h4>Nächste Slide</h4>
          <div id="presenter-next-preview" class="next-preview">—</div>
        </div>
        <div class="presenter-controls">
          <button class="pres-ctrl-btn" onclick="presenterGoto('prev')">← Zurück</button>
          <span id="presenter-counter" class="pres-counter">1 / ?</span>
          <button class="pres-ctrl-btn" onclick="presenterGoto('next')">Weiter →</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
