<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Presentation Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <!-- Particle Canvas Background -->
  <canvas id="particles-bg"></canvas>

  <!-- App Shell -->
  <div id="app">
    <!-- Sidebar Navigation -->
    <nav id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">⚡</div>
        <span class="logo-text">NEXUS</span>
      </div>

      <div class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-view="dashboard">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#studio" class="nav-item" data-view="studio">
          <span class="nav-icon">✦</span>
          <span class="nav-label">AI Studio</span>
        </a>
        <a href="#templates" class="nav-item" data-view="templates">
          <span class="nav-icon">◻</span>
          <span class="nav-label">Templates</span>
        </a>
        <a href="#library" class="nav-item" data-view="library">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Slide Library</span>
        </a>
        <a href="#settings" class="nav-item" data-view="settings">
          <span class="nav-icon">◎</span>
          <span class="nav-label">Einstellungen</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="api-status" id="api-status">
          <div class="status-dot"></div>
          <span>Claude</span>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <div id="view-container">
        <!-- Views are injected here by the router -->
        <div class="loading-screen">
          <div class="loading-orb"></div>
          <p>Nexus lädt...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-container" class="modal-container">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Presenter Mode Window (opened in new window) -->
  <div id="presenter-panel" class="presenter-panel hidden">
    <div class="presenter-header">
      <button class="presenter-close" onclick="closePresenter()">✕ Schließen</button>
      <div class="presenter-timer" id="presenter-timer">00:00</div>
      <button class="presenter-btn" onclick="resetTimer()">↺</button>
    </div>
    <div class="presenter-body">
      <div class="presenter-current">
        <h4>Aktuelle Slide</h4>
        <iframe id="presenter-iframe" src="about:blank"></iframe>
      </div>
      <div class="presenter-sidebar">
        <div class="presenter-notes">
          <h4>Speaker Notes</h4>
          <div id="presenter-notes-content">—</div>
        </div>
        <div class="presenter-next">
          <h4>Nächste Slide</h4>
          <div id="presenter-next-preview" class="next-preview">—</div>
        </div>
        <div class="presenter-controls">
          <button class="pres-ctrl-btn" onclick="presenterGoto('prev')">← Zurück</button>
          <span id="presenter-counter" class="pres-counter">1 / ?</span>
          <button class="pres-ctrl-btn" onclick="presenterGoto('next')">Weiter →</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
