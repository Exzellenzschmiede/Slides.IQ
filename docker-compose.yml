services:
  nexus:
    build: .
    container_name: nexus-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-changeme}
    volumes:
      - nexus-data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  nexus-data:
    driver: local
