services:
  nexus:
    build: .
    container_name: nexus-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    # SMTP and Stripe are now configured in the Admin panel (persisted in the
    # nexus-data volume), NOT via env vars. .env is optional here — load it only
    # for SESSION_SECRET / PORT and as a legacy migration fallback for the old
    # SMTP_*/STRIPE_*/BASE_URL vars. `required: false` lets the container boot
    # even when no .env file exists.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
    # Allow the container to reach the Postfix relay on the VPS host through
    # SMTP_HOST=host.docker.internal (Linux requires this explicit mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nexus-data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  nexus-data:
    driver: local
